# Local production-like stack. Not for development — use `make dev-backend` /
# `make dev-frontend` for that, since they give hot reload.
#
# Usage:
#   cp .env.example .env.production   # fill in real secrets
#   docker compose --env-file .env.production up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bharat_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bharat_os
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host; only the backend service reaches it, over the
    # compose network.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      BHARAT_OS_ENVIRONMENT: production
      BHARAT_OS_DATABASE_URL: postgresql+psycopg://bharat_os:${POSTGRES_PASSWORD}@db:5432/bharat_os
      BHARAT_OS_ENCRYPTION_KEY: ${BHARAT_OS_ENCRYPTION_KEY}
      BHARAT_OS_CORS_ALLOWED_ORIGINS: ${BHARAT_OS_CORS_ALLOWED_ORIGINS}
      BHARAT_OS_LLM_PROVIDER: ${BHARAT_OS_LLM_PROVIDER:-mock}
      BHARAT_OS_GEMINI_API_KEY: ${BHARAT_OS_GEMINI_API_KEY:-}
      BHARAT_OS_GEMINI_MODEL: ${BHARAT_OS_GEMINI_MODEL:-gemini-2.5-pro}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  db-data:
