name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs against both engines. Local development uses SQLite;
        # production uses Postgres. Testing only one would let a
        # Postgres-incompatible migration reach production unnoticed.
        database: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bharat_os
          POSTGRES_PASSWORD: bharat_os
          POSTGRES_DB: bharat_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BHARAT_OS_ENVIRONMENT: test
      # Test-only key. Production keys come from the deployment secret store.
      BHARAT_OS_ENCRYPTION_KEY: Zh3rVJ0dQ8pQ0Z1kX2wA9sT4nR6uY8bC1dE3fG5hI7k=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend
        run: make install-backend

      - name: Select database
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            echo "BHARAT_OS_DATABASE_URL=postgresql+psycopg://bharat_os:bharat_os@localhost:5432/bharat_os_test" >> "$GITHUB_ENV"
          else
            echo "BHARAT_OS_DATABASE_URL=sqlite:///./ci.db" >> "$GITHUB_ENV"
          fi

      - name: Migrations apply and roll back
        run: |
          cd backend
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Lint
        run: cd backend && .venv/bin/ruff check src tests

      - name: Test
        run: make test-backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: make install-frontend

      - name: Typecheck
        run: cd frontend && npm run typecheck

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: make test-frontend

      - name: Build
        run: cd frontend && npm run build

  contract:
    name: Generated types are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: make install

      - name: Regenerate types
        env:
          BHARAT_OS_ENVIRONMENT: test
        run: make types

      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --exit-code -- frontend/src/lib/api-types.ts; then
            echo "::error::frontend/src/lib/api-types.ts is out of date. Run 'make types' and commit the result."
            exit 1
          fi

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bharat_os
          POSTGRES_PASSWORD: bharat_os
          POSTGRES_DB: bharat_os_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      BHARAT_OS_E2E_DATABASE_URL: postgresql+psycopg://bharat_os:bharat_os@localhost:5432/bharat_os_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application
        run: make install

      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run critical browser journeys
        run: make test-e2e

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bharat-os-backend ./backend

      - name: Build frontend image
        run: docker build -t bharat-os-frontend ./frontend
